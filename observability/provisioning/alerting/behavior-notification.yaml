{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "Codex high-risk behaviour notification",
      "folder": "Codex Observability",
      "interval": "1m",
      "rules": [
        {
          "uid": "codex_high_risk_behavior_detected",
          "title": "Codex high-risk behaviour finding detected",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "queryType": "range",
              "relativeTimeRange": {"from": 120, "to": 0},
              "datasourceUid": "loki",
              "model": {
                "datasource": {"type": "loki", "uid": "loki"},
                "editorMode": "code",
                "expr": "sum by (run_hash, finding_id, category, severity, state) (count_over_time({service_name=\"Codex Agent Behavior Diagnosis\"} | event_name=\"codex.behavior_finding\" | severity=~\"high|critical\" [2m]))",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "queryType": "range",
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "queryType": "expression",
              "datasourceUid": "__expr__",
              "model": {"conditions": [], "datasource": {"type": "__expr__", "uid": "__expr__"}, "expression": "A", "intervalMs": 1000, "maxDataPoints": 43200, "reducer": "last", "refId": "B", "settings": {"mode": "dropNN"}, "type": "reduce"}
            },
            {
              "refId": "C",
              "queryType": "expression",
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [{"evaluator": {"params": [0], "type": "gt"}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"params": [], "type": "last"}, "type": "query"}],
                "datasource": {"type": "__expr__", "uid": "__expr__"},
                "expression": "B",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "C",
                "type": "threshold"
              }
            }
          ],
          "dashboardUid": "codex-agent-behavior-security",
          "panelId": 1,
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "annotations": {
            "summary": "A recent privacy-safe high or critical deterministic behaviour finding needs investigation; it is not proof of malicious intent.",
            "dashboard": "http://localhost:3000/d/codex-agent-behavior-security/codex-agent-behavior-security",
            "playbook": "https://vishal8shah.github.io/codex-otel-grafana/#agent-behavior"
          },
          "labels": {"diagnostic": "codex_agent_behavior", "source": "derived", "severity": "warning"},
          "isPaused": false,
          "notification_settings": {
            "receiver": "Codex local dev webhook",
            "group_by": ["alertname", "grafana_folder", "run_hash", "finding_id"],
            "group_wait": "10s",
            "group_interval": "5m",
            "repeat_interval": "4h"
          }
        }
      ]
    }
  ]
}
